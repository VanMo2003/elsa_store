server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /elsa-store/api
spring:
  application:
    name: elsa_store
  # Giá trị sau dấu ":" là mặc định cho máy phát triển; khi triển khai đặt DB_URL / DB_USERNAME / DB_PASSWORD.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/elsa_store_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:03092003}
  jpa:
    hibernate:
      ddl-auto: update
  # Ảnh sản phẩm chụp bằng điện thoại thường 2–5 MB (mặc định của Spring chỉ 1 MB).
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:30MB}
  # Email đơn hàng / thanh toán. Để trống MAIL_USERNAME thì chỉ ghi log, không gửi.
  # Gmail: MAIL_USERNAME = địa chỉ Gmail, MAIL_PASSWORD = App Password 16 ký tự.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
jwt:
  # Khoá ký token (HS512, tối thiểu 64 ký tự). Khoá mặc định chỉ dùng khi phát triển — BE ghi cảnh báo lúc khởi động
  # nếu chưa đặt JWT_SIGNER_KEY.
  signer-key: ${JWT_SIGNER_KEY:6lhXE9HRxzm7EyIVWdl0XPx9eoGdgXm8VNfpaBQ1dUDpZF6NcF8z4fDAO15JFAdF}
  valid-duration: ${JWT_VALID_SECONDS:3600} # 1 tiếng
  refreshable-duration: ${JWT_REFRESH_SECONDS:604800} # 7 ngày


file:
  upload-dir: uploads/

app:
  # Địa chỉ API mà điện thoại mở được; nút "Mở ứng dụng" trong email trỏ tới {public-url}/app-links/...
  public-url: ${APP_PUBLIC_URL:http://localhost:8080/elsa-store/api}
  mail:
    from: ${MAIL_FROM:}
  orders:
    # Đơn VNPay chưa trả sau chừng này phút (tính từ lúc đặt / lần mở link gần nhất) thì tự huỷ, hàng về kho. 0 = tắt;
    # tối thiểu 20 phút vì link VNPay sống 15 phút.
    unpaid-online-cancel-minutes: ${ORDER_UNPAID_CANCEL_MINUTES:30}
    # Đơn đang giao quá chừng này ngày mà khách chưa bấm "đã nhận hàng" thì tự hoàn thành. 0 = tắt.
    auto-complete-days: ${ORDER_AUTO_COMPLETE_DAYS:7}
    # Khách gửi yêu cầu trả hàng trong chừng này ngày sau khi đơn hoàn thành. 0 = tắt đổi trả.
    return-window-days: ${ORDER_RETURN_WINDOW_DAYS:7}
  # Nhắc khách còn hàng trong giỏ sau chừng này giờ không đổi giỏ (mỗi lần bỏ quên nhắc một lần). 0 = tắt.
  cart:
    reminder-hours: ${CART_REMINDER_HOURS:24}
  # Xu thưởng của khách: nhận earn-percent % tiền hàng thực trả khi đơn hoàn thành; 1 xu = 1đ, dùng tối đa
  # max-redeem-percent % tiền hàng của một đơn.
  coins:
    earn-percent: ${COINS_EARN_PERCENT:1}
    max-redeem-percent: ${COINS_MAX_REDEEM_PERCENT:50}
    # Thưởng đánh giá: viết đánh giá đầu tiên cho một sản phẩm / lần đầu thêm ảnh (mỗi sản phẩm một lần).
    review-reward: ${COINS_REVIEW_REWARD:100}
    review-photo-reward: ${COINS_REVIEW_PHOTO_REWARD:200}
  # Giới thiệu bạn bè: đơn hoàn thành đầu tiên của người mới (tiền hàng thực trả từ min-order-value) thì người mời nhận
  # referrer-reward xu, người mới nhận friend-reward xu.
  referral:
    referrer-reward: ${REFERRAL_REFERRER_REWARD:5000}
    friend-reward: ${REFERRAL_FRIEND_REWARD:2000}
    min-order-value: ${REFERRAL_MIN_ORDER_VALUE:100000}

firebase:
  # File JSON service account của Firebase (Project settings > Service accounts). Để trống thì chỉ có
  # thông báo trong app, không gửi push.
  credentials-path: ${FIREBASE_CREDENTIALS:}

ai:
  # gemini (Google AI Studio, có gói miễn phí) | anthropic (Claude, trả phí) | openai (máy chủ chuẩn OpenAI khác:
  # Groq, OpenRouter, Ollama…). Để trống thì tự chọn theo key đang có (GEMINI_API_KEY -> gemini).
  provider: ${AI_PROVIDER:}
  # Không có key nào thì mọi tính năng AI tự tắt. AI_API_KEY dùng cho mọi nhà cung cấp.
  api-key: ${AI_API_KEY:}
  gemini-api-key: ${GEMINI_API_KEY:}
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  # Để trống = địa chỉ mặc định của nhà cung cấp (đặt để trỏ vào máy chủ giả khi thử).
  base-url: ${AI_BASE_URL:}
  # Để trống = model mặc định: gemini-3.8-flash (gemini), claude-sonnet-5 (anthropic). Trợ lý tư vấn cần gọi công cụ.
  assistant-model: ${AI_ASSISTANT_MODEL:}
  fast-model: ${AI_FAST_MODEL:}
  # Model thử tiếp khi model chính quá tải (503) hoặc hết lượt (429), cách nhau bởi dấu phẩy; "none" = tắt.
  # Để trống = mặc định: gemini-3.5-flash,gemini-2.5-flash.
  assistant-fallback-models: ${AI_ASSISTANT_FALLBACK_MODELS:}
  fast-fallback-models: ${AI_FAST_FALLBACK_MODELS:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  # Cửa hàng bật "tự trả lời": khách nhắn mà sau chừng này giây chưa ai của cửa hàng trả lời thì trợ lý trả lời.
  auto-reply-delay-seconds: ${AI_AUTO_REPLY_DELAY_SECONDS:60}

# Mặc định là tài khoản sandbox (thử nghiệm) của VNPay; khi chạy thật đặt VNPAY_TMN_CODE / VNPAY_SECRET_KEY / VNPAY_URL.
vnpay:
  tmnCode: ${VNPAY_TMN_CODE:KUHZ6TQJ}
  secretKey: ${VNPAY_SECRET_KEY:K20SB7Q7577Q70YWF5I512BL3IX95TP4}
  url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  # Nơi VNPay đưa người mua quay về. App bắt địa chỉ này trong WebView (theo đường dẫn /payment/vn-pay-callback) rồi tự
  # gọi BE kiểm chữ ký; trình duyệt thường thì thấy trang kết quả. IPN (máy chủ VNPay gọi BE) là
  # {APP_PUBLIC_URL}/payment/vnpay-ipn — khai báo trong trang quản trị VNPay khi BE có địa chỉ công khai.
  returnUrl: ${VNPAY_RETURN_URL:${app.public-url}/payment/vn-pay-callback}
  version: "2.1.0"
  command: "pay"
  orderType: "other"