# Chạy unit test (không cần MySQL) và build thử Docker image mỗi lần push / mở pull request.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Bỏ qua Spotless (định dạng lại toàn repo) và ElsaStoreApplicationTests (cần MySQL thật).
      - name: mvn test
        run: mvn -B test -Dspotless.apply.skip=true -Dtest='!ElsaStoreApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t elsa-store:ci .
      - name: docker compose config
        run: docker compose config --quiet
